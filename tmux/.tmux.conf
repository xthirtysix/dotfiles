# Truecolor for Ghostty (and xterm-256color fallback)
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

set-option -g status-position top

# Prefix
set -g prefix C-a

# Sort by name
bind s choose-tree -sZ -O name

# Index replacement
set -g base-index 1
setw -g pane-base-index 1

# Keybindings overrides
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

bind -r m resize-pane -Z

# Вставка из системного буфера
bind-key p paste-buffer
bind-key C-p run "pbpaste | tmux load-buffer - && tmux paste-buffer"

set -g mouse on

set-window-option -g mode-keys vi
set-window-option -g pane-border-lines heavy
set-window-option -g pane-border-indicators colour

bind-key -T copy-mode-vi 'v' send -X begin-selection
# Копирование в системный буфер macOS
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'

# Включить копирование мышью в системный буфер
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'

# Дополнительные биндинги для копирования
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi Escape send -X cancel

# Theme settings
# 'terminal' = ANSI colors from Ghostty/pywal palette
set -g @theme-palette 'terminal'
set -g @theme-show-powerline true
set -g @theme-plugins 'battery network git'
set -g @theme-show-left-sep 
set -g @theme-show-right-sep 
set -g @theme-ignore-window-colors true
set -g @theme-git-show-diff-symbol ''
set -g @theme-current-window-color 'pink'
set -g @theme-network-colors 'red dark_gray'
set -g @theme-left-icon-margin-right 0

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'
# Local fork (tmux/.tmux/plugins/tmux-theme), listed so tpm clean keeps it
set -g @plugin 'tmux-plugins/tmux-theme'

# Sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Required
run '~/.tmux/plugins/tpm/tpm'
